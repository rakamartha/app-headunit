name: Build Companion HP APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opsional: isi secrets agar APK companion ditandatangani dengan keystore tetap.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Siapkan release keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            test -s "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diset. APK companion memakai debug signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            ./gradlew assembleDebug --stacktrace
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          mkdir -p dist_apk
          cp "$APK" dist_apk/Greycoat-Companion-App.apk
          ls -lh dist_apk/Greycoat-Companion-App.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Greycoat-Companion-App-APK
          path: dist_apk/Greycoat-Companion-App.apk
